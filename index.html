<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Brand */
    --indigo:#4F46E5; --indigo-deep:#4338CA; --violet:#7C3AED; --violet-light:#9D4EDD;
    --grad:linear-gradient(135deg,#4F46E5 0%,#7C3AED 58%,#9D4EDD 100%);
    --grad-soft:linear-gradient(135deg,rgba(79,70,229,.10),rgba(157,78,221,.10));
    /* Accent */
    --canary:#E4F94D; --canary-deep:#C7E62E;
    /* Ink + surface */
    --ink:#16121F; --ink-soft:#56516B; --ink-faint:#8A85A0;
    --bg:#FFFFFF; --surface:#FAFAFF; --surface-2:#F4F3FB; --line:#E9E7F4; --line-strong:#D8D5EC;
    /* Semantic, clinical surfaces only */
    --emergency:#D93A40; --emergency-tint:#FDECEC; --emergency-line:#F4C9CB;
    --caution:#D98209; --caution-tint:#FCF1DD; --caution-line:#F1DAA6;
    --verified:#1A9F5A; --verified-tint:#E5F6EC; --verified-line:#B4E4C7;
    /* Radius + elevation */
    --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
    --sh-sm:0 1px 2px rgba(22,18,31,.06);
    --sh-md:0 8px 28px -10px rgba(79,70,229,.20),0 2px 8px rgba(22,18,31,.05);
    --sh-lg:0 26px 60px -20px rgba(79,70,229,.30);
    /* Type */
    --serif:'Lora',Georgia,'Times New Roman',serif;
    --sans:'Satoshi','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --indic:'Noto Sans',var(--sans);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 12% 0%, #F4F3FB 0%, transparent 55%),
      radial-gradient(120% 80% at 90% 100%, #FAFAFF 0%, transparent 55%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:0;
    -webkit-font-smoothing:antialiased;line-height:1.6;
  }
  /* App shell */
  .app{
    width:100%;max-width:470px;height:100dvh;max-height:900px;
    background:var(--bg);display:flex;flex-direction:column;
    overflow:hidden;position:relative;
  }
  @media (min-width:520px){
    .app{height:94dvh;border-radius:26px;box-shadow:var(--sh-lg);border:1px solid var(--line)}
  }
  /* Header */
  .hdr{padding:14px 16px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
  .hdr-top{display:flex;align-items:center;gap:12px}
  .logo{flex:none;display:block;height:30px;width:auto}
  .brand{display:flex;flex-direction:column;line-height:1.05;flex:1;min-width:0}
  .brand h1{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:-.01em}
  .brand h1 i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand span{font-size:11.5px;color:var(--ink-soft);font-weight:500;margin-top:2px}
  .hdr-tools{display:flex;align-items:center;gap:6px;margin-top:11px}
  .toolbtn{
    display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);
    font-size:12px;font-weight:600;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);
    padding:7px 11px;cursor:pointer;transition:background .15s,color .15s}
  .toolbtn:hover{background:var(--surface-2)}
  .toolbtn svg{width:14px;height:14px}
  .toolbtn[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--sh-sm)}
  .toolbtn.ghost{margin-left:auto;background:transparent;border-color:transparent}
  .toolbtn.ghost:hover{background:var(--surface)}
  /* Disclosure strip (persistent) */
  .disclose{
    display:flex;align-items:center;gap:8px;padding:8px 16px;
    background:var(--surface);border-bottom:1px solid var(--line);
    font-size:11.5px;color:var(--ink-soft);font-weight:500}
  .disclose svg{width:14px;height:14px;flex:none;color:var(--violet)}
  /* Chat log */
  .log{flex:1;overflow-y:auto;padding:18px 14px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .row{display:flex;gap:9px;align-items:flex-end;max-width:100%}
  .row.user{flex-direction:row-reverse}
  .row .av{flex:none;width:30px;height:30px;border-radius:9px;background:var(--grad);box-shadow:var(--sh-sm);
    display:flex;align-items:center;justify-content:center}
  .row .av svg{width:18px;height:13px;display:block}
  .stack{display:flex;flex-direction:column;gap:5px;max-width:82%}
  .row.user .stack{align-items:flex-end}
  .bubble{
    padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.55;
    background:var(--surface);border:1px solid var(--line);
    border-bottom-left-radius:5px;color:var(--ink);
    animation:rise .32s cubic-bezier(.2,.7,.3,1) both;
  }
  .row.user .bubble{
    background:var(--grad);color:#fff;border-color:transparent;
    border-bottom-left-radius:16px;border-bottom-right-radius:5px}
  .bubble :lang(hi),.bubble :lang(ta),.bubble :lang(mr),.bubble :lang(bn){font-family:var(--indic)}
  .bubble.q{font-weight:500}
  .bubble strong{font-weight:700}
  /* Meta / process note (hidden unless "How it works" is on) */
  .meta{font-size:10.5px;color:var(--ink-soft);padding:0 4px;display:none;flex-wrap:wrap;gap:6px;align-items:center}
  .meta .tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);
    padding:2px 7px;border-radius:var(--r-pill);font-weight:600}
  .meta .tag.agent{color:var(--indigo-deep)}
  .meta .tag svg{width:10px;height:10px}
  /* Source chip */
  .src{display:inline-flex;align-items:center;gap:5px;background:var(--verified-tint);color:var(--verified);
    border:1px solid var(--verified-line);
    font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);width:fit-content;margin-top:2px}
  .src svg{width:12px;height:12px}
  /* Escalation card (emergency color) */
  .card-emerg{
    background:var(--emergency-tint);border:1px solid var(--emergency-line);border-left:4px solid var(--emergency);
    border-radius:var(--r-md);padding:13px 14px;animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
  .card-emerg .head{display:flex;align-items:center;gap:8px;color:var(--emergency);font-weight:800;font-size:13px;
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .card-emerg .head svg{width:18px;height:18px}
  .card-emerg p{font-size:14px;line-height:1.55;color:var(--ink)}
  .call-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:11px;
    background:var(--emergency);color:#fff;font-family:var(--sans);font-weight:800;font-size:15px;
    text-decoration:none;padding:12px 18px;border-radius:12px;width:100%;transition:transform .1s,filter .15s}
  .call-btn:hover{filter:brightness(.96)}
  .call-btn:active{transform:scale(.985)}
  .call-btn svg{width:18px;height:18px}
  /* Misinformation verdict (three-way, semantic colors) */
  .verdict{border-radius:var(--r-md);padding:12px 14px;border:1px solid;animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
  .verdict .v{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px;
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
  .verdict .v svg{width:14px;height:14px}
  .verdict p{font-size:14px;line-height:1.55;color:var(--ink)}
  .v-true{background:var(--verified-tint);border-color:var(--verified-line)} .v-true .v{color:var(--verified)}
  .v-mis{background:var(--caution-tint);border-color:var(--caution-line)} .v-mis .v{color:var(--caution)}
  .v-false{background:var(--emergency-tint);border-color:var(--emergency-line)} .v-false .v{color:var(--emergency)}
  /* Typing */
  .typing{display:flex;gap:4px;padding:13px 15px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;border-bottom-left-radius:5px;width:fit-content}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--violet-light);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.18s}
  .typing span:nth-child(3){animation-delay:.36s}
  /* Composer */
  .composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
  .inbar{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1.5px solid var(--line-strong);
    border-radius:22px;padding:5px 5px 5px 14px;transition:border-color .15s,box-shadow .15s}
  .inbar:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
  .inbar textarea{flex:1;border:none;background:transparent;font-family:var(--sans);font-size:15px;color:var(--ink);
    resize:none;outline:none;line-height:1.4;max-height:96px;padding:7px 0}
  .inbar textarea::placeholder{color:var(--ink-faint)}
  .iconbtn{flex:none;width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;transition:filter .15s,transform .1s,background .15s}
  .iconbtn svg{width:19px;height:19px}
  .iconbtn.mic{background:var(--surface-2);color:var(--violet)}
  .iconbtn.mic:hover{background:#E9E7F4}
  .iconbtn.send{background:var(--grad);color:#fff;box-shadow:var(--sh-sm)}
  .iconbtn.send:hover{filter:brightness(1.05)}
  .iconbtn.send:active{transform:scale(.94)}
  .iconbtn:disabled{opacity:.4;cursor:not-allowed}
  /* Toast */
  .toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(12px);
    background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:10px;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* Focus visibility: 3px violet ring */
  :focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;scroll-behavior:auto!important;transition:none!important}
  }
  .log::-webkit-scrollbar{width:7px}
  .log::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>
<body>
<main class="app" aria-label="MedAI chat">
  <header class="hdr">
    <div class="hdr-top">
      <svg class="logo" viewBox="84 164 348 188" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MedAI">
        <defs><linearGradient id="mg" x1="96" y1="176" x2="416" y2="336" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4F46E5"/><stop offset=".58" stop-color="#7C3AED"/><stop offset="1" stop-color="#9D4EDD"/></linearGradient></defs>
        <g fill="url(#mg)">
          <path d="M96 320V288C96 279.163 103.163 272 112 272C120.837 272 128 279.163 128 288V320C128 328.837 120.837 336 112 336C103.163 336 96 328.837 96 320Z"/>
          <path d="M144 320L144 240C144 231.163 151.163 224 160 224C168.837 224 176 231.163 176 240V320C176 328.837 168.837 336 160 336C151.163 336 144 328.837 144 320Z"/>
          <path d="M192 320L192 192C192 183.163 199.163 176 208 176C216.837 176 224 183.163 224 192V320C224 328.837 216.837 336 208 336C199.163 336 192 328.837 192 320Z"/>
          <path d="M240 288V240C240 231.163 247.163 224 256 224C264.837 224 272 231.163 272 240V288C272 296.837 264.837 304 256 304C247.163 304 240 296.837 240 288Z"/>
          <path d="M288.002 319.75L290.002 191.75C290.14 182.915 297.414 175.864 306.25 176.002C315.085 176.14 322.136 183.415 321.998 192.25L319.998 320.25C319.86 329.085 312.585 336.136 303.75 335.998C294.915 335.86 287.864 328.586 288.002 319.75Z"/>
          <path d="M336.005 319.601L338.005 239.6C338.226 230.766 345.566 223.784 354.4 224.005C363.234 224.226 370.216 231.566 369.995 240.4L367.995 320.4C367.774 329.234 360.434 336.216 351.6 335.995C342.766 335.775 335.784 328.434 336.005 319.601Z"/>
          <path d="M384 320V288C384 279.163 391.163 272 400 272C408.837 272 416 279.163 416 288V320C416 328.837 408.837 336 400 336C391.163 336 384 328.837 384 320Z"/>
        </g>
      </svg>
      <div class="brand">
        <h1>Med<i>AI</i></h1>
        <span>Verified health guidance for every voice</span>
      </div>
    </div>
    <div class="hdr-tools">
      <button class="toolbtn" id="procToggle" aria-pressed="false" aria-label="Toggle process explanations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 5v2M12 17v2M5 12h2M17 12h2"/></svg>
        How it works
      </button>
      <button class="toolbtn ghost" id="restart" aria-label="Restart conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        Restart
      </button>
    </div>
  </header>

  <div class="disclose" role="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
    You are talking to AI, not a doctor. Information from verified sources only.
  </div>

  <div class="log" id="log" role="log" aria-live="polite" aria-label="Conversation"></div>

  <div class="composer">
    <div class="inbar">
      <label for="input" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Type your message</label>
      <textarea id="input" rows="1" placeholder="Tell me what is happening..." autocomplete="off"></textarea>
      <button class="iconbtn mic" id="mic" aria-label="Voice input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="iconbtn send" id="send" aria-label="Send message" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</main>

<script>
(function(){
  "use strict";
  var log=document.getElementById('log'),
      input=document.getElementById('input'),
      send=document.getElementById('send'),
      mic=document.getElementById('mic'),
      procToggle=document.getElementById('procToggle'),
      restart=document.getElementById('restart'),
      toast=document.getElementById('toast');
  var processOn=false, state={history:[]};

  var ic={
    wave:'<svg viewBox="0 0 24 18" fill="#fff" aria-hidden="true"><rect x="1" y="6" width="2.4" height="6" rx="1.2"/><rect x="5.6" y="3" width="2.4" height="12" rx="1.2"/><rect x="10.2" y="1" width="2.4" height="16" rx="1.2"/><rect x="14.8" y="4" width="2.4" height="10" rx="1.2"/><rect x="19.4" y="6.5" width="2.4" height="5" rx="1.2"/></svg>',
    alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
    phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2z"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    cpu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg>'
  };

  function scrollDown(){log.scrollTop=log.scrollHeight;}
  function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){toast.classList.remove('show');},2400);}
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fmt(s){return esc(s).replace(/\n/g,'<br>');}

  function avatar(){var av=document.createElement('div');av.className='av';av.setAttribute('aria-hidden','true');av.innerHTML=ic.wave;return av;}

  function addUser(text){
    var row=document.createElement('div');row.className='row user';
    var st=document.createElement('div');st.className='stack';
    var b=document.createElement('div');b.className='bubble';b.textContent=text;
    st.appendChild(b);row.appendChild(st);log.appendChild(row);scrollDown();
  }
  function addBot(opts){
    var row=document.createElement('div');row.className='row bot';
    row.appendChild(avatar());
    var st=document.createElement('div');st.className='stack';
    if(opts.node){st.appendChild(opts.node);}
    else{var b=document.createElement('div');b.className='bubble'+(opts.isQuestion?' q':'');b.innerHTML=opts.html;st.appendChild(b);}
    if(opts.source){var s=document.createElement('div');s.className='src';s.innerHTML=ic.check+'<span>Source: '+esc(opts.source)+'</span>';st.appendChild(s);}
    if(opts.meta&&opts.meta.agent){
      var m=document.createElement('div');m.className='meta';m.style.display=processOn?'flex':'none';
      m.innerHTML='<span class="tag agent">'+ic.cpu+esc(opts.meta.agent)+'</span>';
      st.appendChild(m);
    }
    row.appendChild(st);log.appendChild(row);scrollDown();
  }
  function addEmergency(body,agent){
    var c=document.createElement('div');c.className='card-emerg';
    c.innerHTML='<div class="head">'+ic.alert+'This may be an emergency</div><p>'+fmt(body)+'</p>'+
      '<a class="call-btn" href="tel:108">'+ic.phone+'Call 108 now</a>';
    addBot({node:c,meta:{agent:agent||'Emergency Escalation'}});
  }
  function addVerdict(text,source,agent){
    var cls='v-mis',label='Misleading',body=text||'';
    var m=body.match(/^\s*(true|misleading|false)\b[\s.:,—-]*/i);
    if(m){
      var w=m[1].toLowerCase();
      if(w==='true'){cls='v-true';label='True';}
      else if(w==='false'){cls='v-false';label='False';}
      else{cls='v-mis';label='Misleading';}
      body=body.slice(m[0].length);
    }
    var icon=cls==='v-true'?ic.check:ic.alert;
    var c=document.createElement('div');c.className='verdict '+cls;
    c.innerHTML='<div class="v">'+icon+esc(label)+'</div><p>'+fmt(body)+'</p>';
    addBot({node:c,source:source,meta:{agent:agent||'Misinformation Detection'}});
  }
  function typingRow(){
    var row=document.createElement('div');row.className='row bot';
    var av=avatar();var t=document.createElement('div');t.className='typing';t.setAttribute('aria-label','MedAI is typing');
    t.innerHTML='<span></span><span></span><span></span>';
    row.appendChild(av);row.appendChild(t);log.appendChild(row);scrollDown();return row;
  }
  function botThen(fn,delay){var row=typingRow();setTimeout(function(){if(row.parentNode)log.removeChild(row);fn();},delay||700);}

  // ----- onboarding: one warm conversational opener, no buttons, no steps -----
  function opener(){
    state={history:[]};
    log.innerHTML='';
    send.disabled=input.value.trim()==='';
    botThen(function(){
      addBot({html:'Namaste. I am MedAI, your health helper.',meta:{agent:'Welcome'}});
      botThen(function(){
        addBot({html:'I am an AI assistant, not a doctor. I share verified health information from WHO and Indian government sources, and I can guide you to care. I cannot diagnose or prescribe.',meta:{agent:'AI disclosure'}});
        botThen(function(){
          addBot({html:'Tell me what is happening, in your own words.',isQuestion:true,meta:{agent:'Listening'}});
        },850);
      },1050);
    },450);
  }

  // ----- active: every message goes to the model, which detects language and replies -----
  function onUser(text){
    if(!text)return;
    addUser(text);
    sendToModel(text);
  }
  function render(reply){
    var agent=reply.agent||'';
    if(reply.type==='emergency'){addEmergency(reply.text,agent);}
    else if(reply.type==='myth'){addVerdict(reply.text,reply.source,agent);}
    else{addBot({html:fmt(reply.text),source:reply.source||'',meta:{agent:agent}});}
    state.history.push({role:'assistant',content:reply.text});
  }
  function sendToModel(text){
    state.history.push({role:'user',content:text});
    var row=typingRow();
    fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:state.history})})
      .then(function(r){return r.json();})
      .then(function(reply){if(row.parentNode)log.removeChild(row);render(reply);})
      .catch(function(){if(row.parentNode)log.removeChild(row);addBot({html:'I could not reach the server. Please try again.',meta:{agent:'network error'}});});
  }

  // ----- input -----
  function autosize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,96)+'px';}
  function trySend(){var v=input.value.trim();if(!v)return;input.value='';autosize();send.disabled=true;onUser(v);}
  input.addEventListener('input',function(){autosize();send.disabled=input.value.trim()==='';});
  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();trySend();}});
  send.addEventListener('click',trySend);
  mic.addEventListener('click',function(){showToast('Voice input is part of the real build. Please type for now.');input.focus();});
  procToggle.addEventListener('click',function(){
    processOn=!processOn;procToggle.setAttribute('aria-pressed',processOn?'true':'false');
    document.querySelectorAll('.meta').forEach(function(m){m.style.display=processOn?'flex':'none';});
    showToast(processOn?'Showing how each reply is handled':'Process view hidden');
  });
  restart.addEventListener('click',opener);
  opener();
})();
</script>
</body>
</html>
